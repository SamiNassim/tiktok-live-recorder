name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Windows, os: windows-latest, platform: windows/amd64 }
          - { name: Linux, os: ubuntu-latest, platform: linux/amd64 }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.platform }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate release
        run: |
          go run ./tools/release check "$TAG"
          git ls-files --error-unmatch README.md
          git merge-base --is-ancestor HEAD origin/master
      - name: Install test dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon0 libwayland-client0 libegl1 libgl1
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build unsigned packages
        run: go tool mygo build -platform "$TARGET" -sign - -skip-notarize
      - name: Collect release assets
        run: go run ./tools/release assets "$TARGET" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  draft:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Create draft and upload packages
        shell: bash
        run: |
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo 'This release is already published. Create a new version instead.' >&2
            exit 1
          fi
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | .[0].tagName // empty')
          if [ -n "$previous" ]; then
            go run ./tools/release notes "$TAG" "$previous" > "$RUNNER_TEMP/release-notes.md"
          else
            go run ./tools/release notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          fi
          go run ./tools/release checksums "$RUNNER_TEMP/release"
          if [ "$existing" != true ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/release/"* --repo "$GITHUB_REPOSITORY" --clobber
          printf 'Review the draft at %s/%s/releases\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
